<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{overflow:hidden}
.card{position:relative;width:1080px;height:1080px;overflow:hidden;background:#f7e1e3;font-family:'Jost',sans-serif;color:#1a1a1a}
.card>*{position:absolute}
.bottle{left:230px;top:120px;width:221px;height:760px}
.shadow{left:200px;top:858px;width:281px;height:44px;border-radius:50%;background:radial-gradient(closest-side,rgba(92,83,86,.30),rgba(92,83,86,0))}
.line{background:#1a1a1a}
.v{left:180px;top:120px;width:2px;height:760px}
.v::before,.v::after,.h::before,.h::after{content:"";position:absolute;background:#1a1a1a}
.v::before,.v::after{left:-11px;width:24px;height:2px}.v::before{top:0}.v::after{bottom:0}
.h{left:230px;top:932px;width:221px;height:2px}
.h::before,.h::after{top:-11px;width:2px;height:24px}.h::before{left:0}.h::after{right:0}
.num{font-size:44px;font-weight:500;line-height:1;white-space:nowrap}
.num small{display:block;font-size:26px;font-weight:400;color:#5c5356;margin-top:8px}
.tall{left:-24px;top:470px;width:180px;text-align:right}
.wide{left:230px;top:956px;width:221px;text-align:center}
.head{left:600px;top:150px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:104px;line-height:.95;letter-spacing:-.02em}
.head i{font-weight:500;color:#e6337f}
.rows{left:600px;top:470px;width:400px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0;border-top:2px solid rgba(26,26,26,.16);font-size:34px}
.row:last-child{border-bottom:2px solid rgba(26,26,26,.16)}
.row b{font-weight:600}.row span{color:#5c5356;font-size:28px}
.note{left:600px;top:800px;width:400px;font-size:30px;line-height:1.35;color:#5c5356}
.name{left:600px;bottom:70px;font-size:28px;font-weight:500}
</style></head><body><div class="card">
<div class="shadow"></div>
<img class="bottle" src="../cutouts/glimmer-kiss.png" alt="">
<div class="line v"></div><div class="line h"></div>
<div class="num tall">3.31 in<small>tall</small></div>
<div class="num wide">0.87 in<small>wide</small></div>
<div class="head">Thumb<br><i>sized.</i></div>
<div class="rows">
<div class="row"><b>Tall</b><div>3.31 in <span>8.4 cm</span></div></div>
<div class="row"><b>Wide</b><div>0.87 in <span>2.2 cm</span></div></div>
<div class="row"><b>Holds</b><div>5 ml</div></div>
</div>
<div class="note">Small enough for a pocket or a small bag.</div>
<div class="name">Glimmer Kiss</div>
</div></body></html>
